# Routine updates are monthly. Security updates use GitHub alerts independently.
version: 2
updates:
  - package-ecosystem: "uv"
    directories:
      - "/backend"
      - "/mcp"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-fixes:
        applies-to: "security-updates"
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-fixes:
        applies-to: "security-updates"
        patterns: ["*"]

  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-fixes:
        applies-to: "security-updates"
        patterns: ["*"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-fixes:
        applies-to: "security-updates"
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-fixes:
        applies-to: "security-updates"
        patterns: ["*"]
