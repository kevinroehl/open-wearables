services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-open-wearables}
      POSTGRES_USER: ${DB_USER:-open-wearables}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Keep the existing database password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 60s
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${OW_IMAGE_PREFIX:-meala-ow}-platform:0.11-fork
    pull_policy: never
    command: scripts/start/app.sh
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/', timeout=4).read()"]
      interval: 10s
      timeout: 5s
      start_period: 10m
      retries: 6
    env_file:
      - .env
    environment:
      - API_PORT=8000
      - DB_HOST=db
      - REDIS_HOST=redis
    ports:
      - "${OW_API_BIND:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  celery-worker:
    image: ${OW_IMAGE_PREFIX:-meala-ow}-platform:0.11-fork
    pull_policy: never
    command: scripts/start/worker.sh
    stop_grace_period: 2m
    env_file:
      - .env
    environment:
      - API_PORT=8000
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    image: ${OW_IMAGE_PREFIX:-meala-ow}-platform:0.11-fork
    pull_policy: never
    command: scripts/start/beat.sh
    env_file:
      - .env
    environment:
      - API_PORT=8000
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  flower:
    image: ${OW_IMAGE_PREFIX:-meala-ow}-platform:0.11-fork
    pull_policy: never
    command: scripts/start/flower.sh
    env_file:
      - .env
    environment:
      - API_PORT=8000
      - DB_HOST=db
      - REDIS_HOST=redis
    ports:
      # Access Flower locally or through an SSH tunnel.
      - "127.0.0.1:${OW_FLOWER_PORT:-5556}:5555"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8
    volumes:
      - redis_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${OW_IMAGE_PREFIX:-meala-ow}-frontend:0.11-fork
    pull_policy: never
    environment:
      VITE_API_URL: ${VITE_API_URL:?Set the public OW API URL}
      API_URL: http://app:8000
    ports:
      - "${OW_PORTAL_BIND:-3000}:3000"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
